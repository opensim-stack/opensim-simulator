[DatabaseService]
    Include-Storage = "config-include/storage/SQLiteStandalone.ini";

[Hypergrid]
    HomeURI = "${Const|BaseURL}:${Const|PublicPort}"

[Modules]
    AssetCaching = "FlotsamAssetCache"
    Include-FlotsamCache = "config-include/FlotsamCache.ini"
    Include-WebRtcVoice = "config-include/os-webrtc-janus.ini"

[AssetService]
    DefaultAssetLoader = "OpenSim.Framework.AssetLoader.Filesystem.dll"
    AssetLoaderArgs = "assets/AssetSets.xml"

[GridService]
    StorageProvider = "OpenSim.Data.Null.dll:NullRegionData"
    Region_TestRegion = "DefaultRegion, DefaultHGRegion"
    ExportSupported = true

[LoginService]
    WelcomeMessage = "Welcome to Test Grid!"

    SRV_HomeURI            = "${Const|BaseURL}:${Const|PublicPort}"
    SRV_InventoryServerURI = "${Const|BaseURL}:${Const|PublicPort}"
    SRV_AssetServerURI     = "${Const|BaseURL}:${Const|PublicPort}"
    SRV_ProfileServerURI   = "${Const|BaseURL}:${Const|PublicPort}"
    SRV_FriendsServerURI   = "${Const|BaseURL}:${Const|PublicPort}"
    SRV_IMServerURI        = "${Const|BaseURL}:${Const|PublicPort}"
    MapTileURL             = "${Const|BaseURL}:${Const|PublicPort}/"

[GridInfoService]
    login = ${Const|BaseURL}:${Const|PublicPort}/
    gridname = "Test Grid"
    gridnick = "testgrid"

[MapImageService]
    TilesStoragePath = "maptiles"
